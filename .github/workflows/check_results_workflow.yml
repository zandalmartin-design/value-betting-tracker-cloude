name: Vyhodnocení value sázek

on:
  workflow_dispatch:  # spouští se ručně tlačítkem
  schedule:
    - cron: '0 10 * * 1'  # navíc jednou týdně (pondělí) pro pravidelnou kontrolu

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Spustit vyhodnocení výsledků
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python check_results.py

      - name: Spočítat staking a CLV
        env:
          BANKROLL_CZK: ${{ vars.BANKROLL_CZK }}
        run: python stake_and_clv.py

      - name: Uložit výsledné soubory zpět do repa
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add staking_recommendations.csv
          git diff --staged --quiet || git commit -m "Aktualizace staking recommendations"
          git push
